# RuTerm — release pipeline
#
# Push a version tag and this builds the installers for all three desktop
# platforms and uploads them to a (draft) GitHub Release:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Artifacts produced:
#   macOS    RuTerm_<ver>_<arch>.dmg        (.app inside)
#   Windows  RuTerm_<ver>_x64-setup.exe     (NSIS) +_RuTerm_<ver>_x64_en-US.msi (WiX)
#   Linux    RuTerm_<ver>_amd64.deb         + .AppImage
#
# Everything is UNSIGNED by default so the first run is green. Signing is
# opt-in: uncomment the env block and provide the matching GitHub secrets
# (Settings → Secrets and variables → Actions). Secrets never live in the repo.
#
# macOS signing + notarization (requires a paid Apple Developer account):
#   APPLE_CERTIFICATE          base64 of "Developer ID Application: …" .p12
#                              (openssl base64 -A -in cert.p12 -out cert.b64)
#   APPLE_CERTIFICATE_PASSWORD password chosen when exporting the .p12
#   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD  Apple ID + app-specific password (for notarization)
#   APPLE_TEAM_ID              10-char team id
#
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # upload release artifacts

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libgtk-3-dev patchelf

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build & upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS signing (uncomment together with the secrets above) ---
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Windows signing: add Azure Trusted Signing / OV cert later ---
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'RuTerm ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            - macOS: `.dmg` — open, drag RuTerm into Applications.
              Unsigned build: right-click → **Open** on first launch,
              or System Settings → Privacy & Security → **Open Anyway**.
            - Windows: `*-setup.exe` (NSIS) or `*.msi`.
              Unsigned build: SmartScreen → **More info** → **Run anyway**.
            - Debian/Ubuntu: `sudo apt install ./RuTerm_<version>_amd64.deb`
              (or `.AppImage`, chmod +x and run).

            See README.md for what's included. Report security issues to the
            contact address in the README, never a public issue.
          releaseDraft: true
          prerelease: false
