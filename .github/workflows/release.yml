# RuTerm — release pipeline
#
# Push a version tag and this builds the installers for all three desktop
# platforms and uploads them to a (draft) GitHub Release:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Artifacts produced:
#   macOS    RuTerm_<ver>_aarch64.dmg + RuTerm_<ver>_x64.dmg (.app inside)
#   Windows  RuTerm_<ver>_x64-setup.exe     (NSIS) +_RuTerm_<ver>_x64_en-US.msi (WiX)
#   Linux    RuTerm_<ver>_amd64.deb         + .AppImage
#
# macOS signing is opt-in: set the ENABLE_MACOS_SIGNING repository variable to
# `true` and configure the Apple secrets below. Without it, macOS builds are
# unsigned (no Developer ID / notarization), matching the local release build.
# Secrets never live in the repo, and SHA256SUMS is generated after the builds.
#
# macOS signing + notarization (requires a paid Apple Developer account):
#   APPLE_CERTIFICATE          base64 of "Developer ID Application: …" .p12
#                              (openssl base64 -A -in cert.p12 -out cert.b64)
#   APPLE_CERTIFICATE_PASSWORD password chosen when exporting the .p12
#   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD  Apple ID + app-specific password (for notarization)
#   APPLE_TEAM_ID              10-char team id
#
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # upload release artifacts

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm
            os: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows
            os: windows-latest
            args: ''
          - platform: linux
            os: ubuntu-22.04
            args: ''

    steps:
      # Pinned to full commit SHAs so a moved floating tag cannot alter builds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Vite 8 needs Promise.withResolvers, which landed in Node 22.
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libgtk-3-dev patchelf

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build & upload installers (unsigned)
        if: ${{ vars.ENABLE_MACOS_SIGNING != 'true' || !startsWith(matrix.platform, 'macos') }}
        # generates SHA256SUMS in a separate job below, after all builds finish
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'RuTerm ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            - macOS: `.dmg` — open, drag RuTerm into Applications.
              If this build is unsigned, contact the maintainer; do not bypass
              Gatekeeper unless you verified the SHA256SUMS yourself.
            - Windows: `*-setup.exe` (NSIS) or `*.msi`.
              If this build is unsigned, SmartScreen may warn; verify the
              SHA256SUMS before running anything.
            - Debian/Ubuntu: `sudo apt install ./RuTerm_<version>_amd64.deb`
              (or `.AppImage`, chmod +x and run).

            See README.md for what's included. Report security issues to the
            contact address in the README, never a public issue.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build & upload signed macOS installers
        if: ${{ vars.ENABLE_MACOS_SIGNING == 'true' && startsWith(matrix.platform, 'macos') }}
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'RuTerm ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            - macOS: `.dmg` — open, drag RuTerm into Applications. This build is
              Developer ID signed and notarized; verify the SHA256SUMS.
            - Windows: `*-setup.exe` (NSIS) or `*.msi`.
              If this build is unsigned, SmartScreen may warn; verify the
              SHA256SUMS before running anything.
            - Debian/Ubuntu: `sudo apt install ./RuTerm_<version>_amd64.deb`
              (or `.AppImage`, chmod +x and run).

            See README.md for what's included. Report security issues to the
            contact address in the README, never a public issue.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir sums
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.msi' --pattern '*.exe' \
            --pattern '*.deb' --pattern '*.AppImage' \
            --dir sums
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd sums && sha256sum * > SHA256SUMS)
          cat sums/SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" sums/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
