[workspace]
resolver = "2"
members = ["crates/rterm-core", "crates/rterm-server", "crates/rterm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RuTerm contributors"]
description = "RuTerm — open-source SSH workspace for the desktop"
repository = "https://github.com/dnysaz/ruterm-app"
homepage = "https://github.com/dnysaz/ruterm-app"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
russh = "0.65"
base64 = "0.22"
rand = "0.8"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
