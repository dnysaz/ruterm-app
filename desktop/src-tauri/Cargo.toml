[package]
name = "rterm-app"
version = "0.1.1"
description = "rterm — open-source SSH workspace (Tauri + Svelte)"
authors = ["rterm contributors"]
license = "MIT"
edition = "2021"

[lib]
# Keep a unique lib name so the bin and lib do not clash on Windows.
name = "rterm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rterm-core = { path = "../../rust/crates/rterm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
portable-pty = "0.9.0"
tauri-plugin-opener = "2.7.3"
tauri-plugin-dialog = "2"
zeroize = "1"
# BYOK AI chat: OpenRouter client (rustls keeps the bundle self-contained).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# See https://tauri.app/concept/size/ for the release profile rationale.
# R-09: no `panic = "abort"` — unwinding keeps a single bad IPC payload from
# killing the whole app, and Tauri's desktop target is a binary, not a cdylib.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
