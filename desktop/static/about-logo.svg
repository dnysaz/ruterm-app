<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RuTerm icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152844"/>
      <stop offset="0.55" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc4ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App tile. macOS applies its own rounded mask on top of this. -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)" stroke="#214a7a" stroke-width="4" />
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#0a84ff" stroke-opacity="0.22" stroke-width="3" />

  <!-- Terminal window -->
  <g filter="url(#glow)">
    <rect x="72" y="96" width="368" height="320" rx="30" fill="#0a1424" stroke="url(#brand)" stroke-width="12" />
  </g>
  <path d="M72 156H440" stroke="#0a84ff" stroke-opacity="0.75" stroke-width="9" />
  <circle cx="108" cy="126" r="9" fill="#ff5f57" />
  <circle cx="140" cy="126" r="9" fill="#febc2e" />
  <circle cx="172" cy="126" r="9" fill="#28c840" />

  <!-- Command prompt: >_ -->
  <path d="M178 226l44 34-44 34" fill="none" stroke="#8bd4ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M252 298h78" stroke="#8bd4ff" stroke-width="22" stroke-linecap="round" />
</svg>
